{% set name = "csbdeep" %}
{% set version = "0.8.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/csbdeep-{{ version }}.tar.gz
  sha256: de0188d39d5eaeafe02d34c50fc1cd67d922b920628726fbdccdf3ff478f5e86

build:
  skip: true  # [py==313]
  entry_points:
    - care_predict = csbdeep.scripts.care_predict:main
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
  host:
    - pip
    - python
  run:
    - tensorflow >=2  # [unix]
    - matplotlib-base
    - numpy
    - python
    - scipy
    - six
    - tifffile
    - tqdm
    - packaging
  run_constrained:   # [win]
    - tensorflow >=2  # [win]

test:
  imports:
    - csbdeep
  commands:
    - pip list
    # - pip check
    - care_predict --help
  requires:
    - pip

about:
  home: http://csbdeep.bioimagecomputing.com/
  summary: CSBDeep - a toolbox for Content-aware Image Restoration (CARE)
  license: BSD-3-Clause
  license_file: LICENSE.txt
  dev_url: https://github.com/CSBDeep/CSBDeep
  doc_url: http://csbdeep.bioimagecomputing.com/doc/

extra:
  recipe-maintainers:
    - goanpeca
    - uschmidt83
